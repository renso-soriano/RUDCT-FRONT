
<ngx-spinner bdColor = "rgba(255, 255, 255, 0.4)" size = "medium" color = "#003876" type = "square-jelly-box" [fullScreen] = "false"><p style="color: #003876" > Cargando... </p></ngx-spinner>
<div *ngIf="!loading" class="map-container">
  <div class="row">
    <div class="col-12">
      <div class="map-frame">
        <div id="map"></div>
      </div>
    </div>
  </div>
</div>
