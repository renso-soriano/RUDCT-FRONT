<!-- start -->
<div class="row">
  <div class="col-12">
    <!-- Kick start -->
    <div id="kick-start" class="card">
      <div class="card-header">
        <h4 class="card-title">Detalles del clasificador funcional</h4>
      </div>
      <div class="card-content">
        <div class="card-body">
          <div class="card-text">

            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="danger bold"><strong>Código: </strong> </span>
                    <label for="Id">{{temaComun.id}}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="danger bold"><strong>Finalidad: </strong> </span>
                    <label for="finalidad">{{temaComun.finalidad}}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="danger bold"><strong>Función: </strong> </span>
                    <label for="funcion">{{temaComun.funcion}}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="danger bold"><strong>Sub-función: </strong> </span>
                    <label for="nombre">{{temaComun.nombre}}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="danger bold"><strong>Tema común: </strong> </span>
                    <label for="nombre">{{temaComun.temaCommun}}</label>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
    <!--/ Kick start -->
  </div>
</div>

<div>
  <a [routerLink]="['/mantenimientos/temaComun']" class="btn btn-primary"><span>Volver a listado</span>
  </a>

</div>
