<!-- start -->
<div class="row">
  <div class="col-12">
    <!-- Kick start -->
    <div id="kick-start" class="card">
      <div class="card-header">
        <h4 class="card-title">Detalles de la categoria de beneficiario</h4>
      </div>
      <div class="card-content">
        <div class="card-body">
          <div class="card-text">
            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="primary">Id: </span>
                    <label for="Id">{{categoriaBeneficiario.Id}}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="primary">Nombre: </span>
                    <label for="nombre">{{categoriaBeneficiario.Nombre}}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="div">
              <div class="row">
                <div class="col-sm-12">
                  <div class="form-group">
                    <span class="primary">Activa: </span>
                    <label for="activo">{{categoriaBeneficiario.Activo == 1?"Si":"No"}}</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--/ Kick start -->
  </div>
</div>

<div>
  <a [routerLink]="['/categoriaBeneficiario']" class="btn btn-primary"><span>Volver a listado</span>
  </a>

</div>
