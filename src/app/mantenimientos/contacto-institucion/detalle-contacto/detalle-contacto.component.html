<!-- start -->
<div class="row">
    <div class="col-12">
      <!-- Kick start -->
      <div id="kick-start" class="card">
        <div class="card-header">
          <h4 class="card-title">Detalles del Contacto Institucional</h4>
        </div>
        <div class="card-content">
          <div class="card-body">
            <div class="card-text">
              <div class="div">
                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <span class="danger bold"><strong>Código: </strong> </span>
                      <label for="id">{{contacto.id}}</label>
                    </div>
                  </div>
                </div>
              </div>
  
              <div class="div">
                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <span class="danger bold"><strong>Nombre: </strong> </span>
                      <label for="nombre">{{contacto.nombre}}</label>
                    </div>
                  </div>
                </div>
              </div>
  
              <div class="div">
                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <span class="danger bold"><strong>Apellido: </strong> </span>
                      <label for="apellido">{{contacto.apellido}}</label>
                    </div>
                  </div>
                </div>
              </div>
  
              <div class="div">
                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <span class="danger bold"><strong>Institucion: </strong> </span>
                      <label for="tipoTecnicoNombre">{{contacto.nombreinstitucion}}</label>
                    </div>
                  </div>
                </div>
              </div>
  
              <div class="div">
                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <span class="danger bold"><strong>Telefono: </strong> </span>
                      <label for="telefono">{{contacto.telefono}}</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="div">
                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <span class="danger bold"><strong>Extension: </strong> </span>
                      <label for="extension">{{contacto.extension}}</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="div">
                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <span class="danger bold"><strong>Email: </strong> </span>
                      <label for="email">{{contacto.email}}</label>
                    </div>
                  </div>
                </div>
              </div>
  
  
            </div>
          </div>
        </div>
      </div>
      <!--/ Kick start -->
    </div>
  </div>
  
  <div>
    <a [routerLink]="['/mantenimientos/tecnicos']" class="btn btn-primary"><span>Volver a listado</span>
    </a>
  
  
  </div>
