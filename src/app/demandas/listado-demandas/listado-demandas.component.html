<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="square-jelly-box" [fullScreen]="false">
  <p style="color: white"> Cargando... </p>
</ngx-spinner>
<div class="row">
  <div class="col-12">
    <div class="w-100 d-flex justify-content-end">
      <a *ngIf="usuarioPermisos.includes('MANAGE') || usuarioPermisos.includes('POST')"[routerLink]="['/demandas/registroDemandas']" data-toggle="tooltip" data-placement="bottom"
        title="Nueva Demanda" class="btn btn btn-primary btn-sm ml-1"><i class="fa fa-plus-circle"></i></a>

      <a id="tableRefresh" href="javascript:void(0)" data-toggle="tooltip" data-placement="bottom"
        title="Actualizar tabla" class="btn btn btn-info btn-sm ml-1"><i class="fa fa-refresh"></i></a>

    </div>
  </div>
</div>

<!-- Filter Datatables -->
<section id="ngx-datatable-filter">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title">Listado de Demandas</h4>
        </div>
        <div class="card-content">
          <div class="card-body">


            <div class="col-md-12 mb-2">
              <app-data-filter *ngIf="!loadingIndicator && usuarioPermisos.includes('MANAGE')"   [filtros]="filtros" (filterEvent)="getFilters($event)">
              </app-data-filter>
            </div>

            <div class="col-md-10">
              <div class="w-100 d-flex left-content-end">
                <ng-select [items]="limitSelect" bindLabel="label" bindValue="value" (change)="_changeRowLimits($event)"
                  name="limit" id="limit" [(ngModel)]="limitSelected" style="width: 25%;" [clearable]="false">
                </ng-select>
                <a (click)="exportexcel()" data-toggle="tooltip" data-placement="bottom" title="Exportar datos en Excel"
                  class="btn btn btn-success btn-sm ml-1">
                  <i class="fa fa-file-excel-o"> Exportar Excel</i>
                </a>
              </div>
            </div><br>

            <div class="col-md-12">
              <ngx-datatable class="bootstrap core-bootstrap" [rows]="rows" [columns]="columns"
                [columnMode]="ColumnMode.force" [headerHeight]="50" [footerHeight]="50" [externalPaging]="true"
                [externalSorting]="false" [count]="page.count" [offset]="page.offset" [limit]="page.limit"
                [sortType]="'single'" (page)="pageCallback($event)" rowHeight="auto" [reorderable]="reorderable">
                <ngx-datatable-column *ngFor="let column of columns" name="{{column.name}}" [sortable]="column.sortable"
                  prop="{{column.prop}}">
                  <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                    <span *ngIf="column.prop != 'nombreEstadoDemanda'">
                      {{value}}
                    </span>
                    <div *ngIf="column.prop == 'nombreEstadoDemanda'" class="badge badge-pill"
                      [ngClass]="{'bg-danger': value == 'Rechazado', 'bg-warning':value == 'Visto/Recibido', 'bg-info':value == 'Existe en PEI', 'bg-primary':value == 'No vista', 'bg-success':value == 'Acogida para programa y/o proyecto'}">
                      {{ value }}
                    </div>
                  </ng-template>
                </ngx-datatable-column>
                <!-- Acciones -->
                <ngx-datatable-column name="Acciones">
                  <ng-template let-row="row" ngx-datatable-cell-template>
                    <a *ngIf="usuarioPermisos.includes('MANAGE') || usuarioPermisos.includes('GET')" class="btn-sm      btn-warning text-white  ft-eye" (click)="verDetalles(row.id)"
                      title="Ver detalles"></a>
                    <a *ngIf="usuarioPermisos.includes('MANAGE')" class="btn-sm ml-1 btn-success text-white ft-edit" (click)="editar(row.id)" title="Editar"></a>
                    <a *ngIf="usuarioPermisos.includes('MANAGE') || usuarioPermisos.includes('DELETE')"class="btn-sm ml-1 btn-danger text-white ft-trash-2" (click)="eliminar(row.id)"
                      title="Eliminar"></a>
                    <a *ngIf="usuarioPermisos.includes('MANAGE') || usuarioPermisos.includes('PUT')" class="btn-sm ml-1 btn-primary text-white ft-more-vertical"
                      (click)="openVerticallyCentered(content,row.id)" title="Cambiar estados"></a>
                  </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-footer>
                  <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                    let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset"
                    let-isVisible="isVisible">
                    <div class="page-count">
                      Mostrando {{(offset * pageSize)+1}} a {{(rowCount>
                      (curPage*pageSize))?(curPage*pageSize):(rowCount)}} de
                      {{(rowCount)}} registros.
                    </div>
                    <datatable-pager [pagerLeftArrowIcon]="'datatable-icon-left'"
                      [pagerRightArrowIcon]="'datatable-icon-right'" [pagerPreviousIcon]="'datatable-icon-prev'"
                      [pagerNextIcon]="'datatable-icon-skip'" [page]="curPage" [size]="pageSize" [count]="rowCount"
                      [hidden]="!((rowCount / pageSize) > 1)" (change)="table.onFooterPage($event)">
                    </datatable-pager>
                  </ng-template>
                </ngx-datatable-footer>
              </ngx-datatable>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!--/ Filter Datatables -->

<!-- modalStart -->

<ng-template #content let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Cambiar estado</h4>
  </div>
  <div class="modal-body">
    <form (submit)="submit()" [formGroup]="estadoForm">

      <div class="row">
        <div class="col-sm-8">
          <div class="form-group">
            <label for="estado">Estado</label>
            <ng-select [appendTo]="'body'" [items]="listadoEstados | async" bindLabel="name" bindValue="id"
              name="estado" id="estado" (change)="estadoChange()" placeholder="Seleccione estado"
              formControlName="estado">
            </ng-select>
            <div *ngIf="EF.estado.invalid && (EF.estado.dirty || EF.estado.touched)"
              class="help-block mt-1 text-danger">

              <div *ngIf="EF.estado.errors.required">
                <i class="ft-alert-circle align-middle"></i> El campo es requerido
              </div>

            </div>
          </div>
        </div>
      </div>

      <div class="row" *ngIf="EF.estado.value == '3'">
        <div class="col-sm-8">
          <div class="form-group">
            <label for="rechazada">Por qué es rechazada?</label>
            <textarea class="form-control" name="rechazada" id="rechazada" rows="3"
              formControlName="justificacionRechazo"></textarea>
            <!-- <div *ngIf="nivelDemanda.invalid && (nivelDemanda.dirty || nivelDemanda.touched)"
                            class="help-block mt-1 text-danger">

                            <div *ngIf="nivelDemanda.errors.required">
                              <i class="ft-alert-circle align-middle"></i> El campo es requerido
                            </div>

                          </div> -->
          </div>
        </div>
      </div>

      <div class="row" *ngIf="EF.estado.value == '5'">
        <div class="col-sm-8">
          <div class="form-group">
            <label for="codigoPei">Codigo PEI</label>
            <input type="text" class="form-control" name="codigoPei" id="codigoPei" rows="3"
              formControlName="codigoPei">
            <!-- <div *ngIf="nivelDemanda.invalid && (nivelDemanda.dirty || nivelDemanda.touched)"
                            class="help-block mt-1 text-danger">

                            <div *ngIf="nivelDemanda.errors.required">
                              <i class="ft-alert-circle align-middle"></i> El campo es requerido
                            </div>

                          </div> -->
          </div>
        </div>
      </div>

      <div class="row" *ngIf="EF.estado.value == '6'">
        <div class="col-sm-8">
          <div class="form-group">
            <label for="codigoPoa">Codigo POA</label>
            <input type="text" class="form-control" name="codigoPoa" id="codigoPoa" rows="3"
              formControlName="codigoPoa">
            <!-- <div *ngIf="nivelDemanda.invalid && (nivelDemanda.dirty || nivelDemanda.touched)"
                            class="help-block mt-1 text-danger">

                            <div *ngIf="nivelDemanda.errors.required">
                              <i class="ft-alert-circle align-middle"></i> El campo es requerido
                            </div>

                          </div> -->
          </div>
        </div>
      </div>

      <div class="row" *ngIf="EF.estado.value == '4'">
        <div class="col-sm-8">
          <div class="form-group">
            <label for="codigoSnip">Codigo Snip</label>
            <input type="text" class="form-control" name="codigoSnip" id="codigoSnip" rows="3"
              formControlName="codigoSnip">
            <!-- <div *ngIf="nivelDemanda.invalid && (nivelDemanda.dirty || nivelDemanda.touched)"
                            class="help-block mt-1 text-danger">

                            <div *ngIf="nivelDemanda.errors.required">
                              <i class="ft-alert-circle align-middle"></i> El campo es requerido
                            </div>

                          </div> -->
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <a [routerLink]="['/demandas']" class="btn btn-primary" (click)="modal.close('Close click')"><span>Volver a
            listado</span>
        </a>
        <input type="submit" value="Continuar" class="btn btn-success" [disabled]="estadoForm.invalid"
          (click)="modal.close('Close click')">

      </div>

    </form>

  </div>


</ng-template>
