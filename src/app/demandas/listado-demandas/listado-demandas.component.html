<div class="row">
  <div class="col-12">
    <div class="w-100 d-flex justify-content-end">
      <a [routerLink]="['/demandas/registroDemandas']" data-toggle="tooltip" data-placement="bottom"
        title="Nueva Demanda" class="btn btn btn-primary btn-sm ml-1"><i class="fa fa-plus-circle"></i></a>

      <a id="tableRefresh" href="javascript:void(0)" data-toggle="tooltip" data-placement="bottom"
        title="Actualizar tabla" class="btn btn btn-info btn-sm ml-1"><i class="fa fa-refresh"></i></a>

    </div>
  </div>
</div>

<!-- Filter Datatables -->
<section id="ngx-datatable-filter">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title">Listado de Demandas</h4>
        </div>
        <div class="card-content">
          <div class="card-body">

            <!-- ngx-datatable-filter -->
            <!-- <fieldset class="form-group">
              <label for="ngx-filter-ref">Buscar:
                <input id="ngx-filter-ref" class="form-control form-control-sm d-inline-block width-200" type="text"
                  placeholder="Nombre de demanda..." (keyup)="filterUpdate($event)" />
              </label>
            </fieldset> -->
            <div class="col-md-12 mb-2">
              <app-data-filter *ngIf="!loadingIndicator" [filtros]="filtros" (filterEvent)="getFilters($event)" ></app-data-filter>
            </div>
            <!--div class="col-sm-">
              <div class="form-group">
                <label for="distrito">Registros por página</label>
                <ng-select [items]="limitSelect" bindLabel="label" bindValue="value" (change)="_changeRowLimits($event)"
                  name="limit" id="limit" [(ngModel)]="limitSelected" style="width: 25%;" [clearable]="false">
                </ng-select>
              </div>
            </div-->
            <div class="col-md-10">
              <div class="w-100 d-flex left-content-end">
                <ng-select [items]="limitSelect" bindLabel="label" bindValue="value" (change)="_changeRowLimits($event)"
                  name="limit" id="limit" [(ngModel)]="limitSelected" style="width: 25%;" [clearable]="false">
                </ng-select>
                <a  (click)="exportexcel()" data-toggle="tooltip" data-placement="bottom" title="Exportar datos en Excel" class="btn btn btn-success btn-sm ml-1">
                 <i class="fa fa-file-excel-o"> Exportar Excel</i>
             </a>
            </div>
                    </div><br>
            <div class="col-md-12">
              <ngx-datatable class="bootstrap core-bootstrap"
              [rows]="rows"
              [columns]="columns"
              [columnMode]="ColumnMode.force"
              [headerHeight]="50"
              [footerHeight]="50"
              [externalPaging]="true"
              [externalSorting]="false"
              [count]="page.count"
              [offset]="page.offset"
              [limit]="page.limit"
              [sortType]="'single'"
              (page)="pageCallback($event)"
              rowHeight="auto"
              [reorderable]="reorderable">
              <ngx-datatable-column *ngFor="let column of columns" name="{{column.name}}" [sortable]="column.sortable"
                prop="{{column.prop}}">
                <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                  <span *ngIf="column.prop != 'nombreEstadoDemanda'">
                    {{value}}
                  </span>
                  <div *ngIf="column.prop == 'nombreEstadoDemanda'" class="badge badge-pill"
                    [ngClass]="{'bg-danger': value == 'NO INICIADA', 'bg-warning':value == 'ACEPTADA POR LA INSTITUCION', 'bg-info':value == 'EN EJECUCION', 'bg-success':value == 'EJECUTADA'}">
                    {{ value }}
                  </div>
                </ng-template>
              </ngx-datatable-column>
              <!-- Acciones -->
              <ngx-datatable-column name="Acciones">
                <ng-template let-row="row" ngx-datatable-cell-template>
                  <a class="btn-sm      btn-warning text-white  ft-eye" (click)="verDetalles(row.id)"
                    title="Ver detalles"></a>
                  <a class="btn-sm ml-1 btn-success text-white ft-edit" (click)="editar(row.id)" title="Editar"></a>
                  <a class="btn-sm ml-1 btn-danger text-white ft-trash-2" (click)="eliminar(row.id)"
                    title="Eliminar"></a>
                </ng-template>
              </ngx-datatable-column>

              <ngx-datatable-footer>
                <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                  let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-isVisible="isVisible">
                  <div class="page-count">
                    Mostrando {{(offset * pageSize)+1}} a {{(rowCount>
                    (curPage*pageSize))?(curPage*pageSize):(rowCount)}} de
                    {{(rowCount)}} registros.
                  </div>
                  <datatable-pager [pagerLeftArrowIcon]="'datatable-icon-left'"
                    [pagerRightArrowIcon]="'datatable-icon-right'" [pagerPreviousIcon]="'datatable-icon-prev'"
                    [pagerNextIcon]="'datatable-icon-skip'" [page]="curPage" [size]="pageSize" [count]="rowCount"
                    [hidden]="!((rowCount / pageSize) > 1)" (change)="table.onFooterPage($event)">
                  </datatable-pager>
                </ng-template>
              </ngx-datatable-footer>
            </ngx-datatable>
             </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!--/ Filter Datatables -->
