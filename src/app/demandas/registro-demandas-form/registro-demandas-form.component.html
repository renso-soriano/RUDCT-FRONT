<!-- start -->
<div class="row">
  <div class="col-12">
    <!-- Kick start -->
    <div id="kick-start" class="card">
      <div class="card-header">
        <h4 class="card-title">Registro de demandas municipales</h4>
      </div>
      <div class="card-content">
        <div class="card-body">
          <div class="card-text">
            <div class="div">
              <form (submit)="submit()" [formGroup]="registerForm">

                <div class="row">
                  <div class="col-12 section-divider">
                    <h6 class="primary">Informacion de la demanda</h6>
                    <hr />
                  </div>
                </div>

                <div class="row">
                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="año">Año</label>
                      <select class="form-control" id="año" name="año" formControlName="año">
                        <option *ngFor="let anio of anios" [value]="anio.valor">
                          {{anio.texto}}</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="region">Region</label>
                      <select class="form-control" id="region" name="region"
                        (change)="onRegionChange($event.target.value)" formControlName="region">
                        <option *ngFor="let region of regiones" [value]="region.valor">
                          {{region.texto}}</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="provincia">Provincia</label>
                      <select class="form-control" id="provincia" name="provincia"
                        (change)="onProvinciaChange($event.target.value)" formControlName="provincia">
                        <option *ngFor="let provincia of provincias" [value]="provincia.valor">
                          {{provincia.texto}}</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="row">

                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="municipio">Municipio</label>
                      <select class="form-control" id="municipio" name="municipio"
                        (change)="onMunicipiosChange($event.target.value)" formControlName="municipio">
                        <option *ngFor="let municipio of municipios" [value]="municipio.valor">
                          {{municipio.texto}}</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="distrito">Distrito municipal</label>
                      <select class="form-control" id="distrito" name="distrito" formControlName="distrito">
                        <option *ngFor="let distrito of distritosMunicipales" [value]="distrito.valor">
                          {{distrito.texto}}</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="fuente">Fuente de demanda</label>
                      <select class="form-control" id="fuente" name="fuente" formControlName="fuente">
                        <option *ngFor="let fuente of fuenteDemandas" [value]="fuente.valor">
                          {{fuente.texto}}</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <label for="demanda">Demanda</label>
                      <textarea class="form-control" name="demanda" id="demanda" rows="2"
                        formControlName="demanda"></textarea>
                      <div *ngIf="demanda.invalid && (demanda.dirty || demanda.touched)" class="alert alert-danger">
                        <div *ngIf="demanda.errors.required">
                          El campo Demanda es requerido
                        </div>
                        <div *ngIf="demanda.errors.usernameUnico">
                          Esa demanda ya existe
                        </div>

                      </div>

                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-12 section-divider">
                    <h6 class="primary">Vinculacion con END y PNPSP</h6>
                    <hr />
                  </div>
                </div>

                <div class="row">
                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="eje">Eje End</label>
                      <select class="form-control" id="eje" name="eje" (change)="onEjeChange($event.target.value)"
                        formControlName="eje">
                        <option *ngFor="let eje of ejesEnd" [value]="eje.valor">
                          {{eje.texto}}</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-sm-8">
                    <div class="form-group">
                      <label for="objetivo">Objetivo</label>
                      <select class="form-control" id="objetivo" name="objetivo" formControlName="objetivo">
                        <option *ngFor="let objetivo of objetivosEnd" [value]="objetivo.valor">
                          {{objetivo.texto}}</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-12">

                    <div class="row">
                      <div class="col-sm-4">
                        <div class="form-group">
                          <label for="politica">Politica</label>
                          <select class="form-control" id="politica" name="politica" formControlName="politica">
                            <option *ngFor="let politica of politicas" [value]="politica.valor">
                              {{politica.texto}}</option>
                          </select>

                        </div>
                      </div>

                      <div class="col-sm-4">
                        <div class="form-group">
                          <a class="btn btn-primary mt-3" (click)="agregarPolitica()">+</a>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>

                <div class="row">
                  <div class="col-12 section-divider">
                    <h6 class="primary">Instituciones Involucaradas</h6>
                    <hr />
                  </div>
                </div>

                <div class="row">
                  <div class="col-sm-4">
                    <div class="form-group">
                      <label for="tecnico">Técnico OMPP</label>
                      <select class="form-control" id="tecnico" name="tecnico" formControlName="tecnico">
                        <option *ngFor="let tecnico of tecnicos" [value]="tecnico.valor">
                          {{tecnico.texto}}</option>
                      </select>
                    </div>
                  </div>

                  <div class="col-sm-8">
                    <div class="form-group">
                      <label for="institucionResponsable">Institucion primaria</label>
                      <select class="form-control" id="institucionResponsable" name="institucionResponsable"
                        formControlName="institucionResponsable">
                        <option *ngFor="let institucionResponsable of instituciones"
                          [value]="institucionResponsable.valor">
                          {{institucionResponsable.texto}}</option>
                      </select>
                    </div>
                  </div>

                </div>

                <div class="row">
                  <div class="col-12">
                    <div class="row">
                      <div class="col-sm-4">
                        <div class="form-group">
                          <label for="institucionesColaboradoras">Instituciones Colaboradoras</label>
                          <select class="form-control" id="institucionesColaboradoras" name="institucionesColaboradoras"
                            formControlName="institucionesColaboradoras">
                            <option *ngFor="let institucionColaboradora of instituciones"
                              [value]="institucionColaboradora.valor">
                              {{institucionColaboradora.texto}}</option>
                          </select>

                        </div>
                      </div>

                      <div class="col-sm-4">
                        <div class="form-group">
                          <a class="btn btn-primary mt-3" (click)="agregarPolitica()">+</a>
                        </div>
                      </div>
                    </div>


                  </div>
                </div>

                <div class="row">
                  <div class="col-12 section-divider">
                    <h6 class="primary">Actividades</h6>
                    <hr />
                  </div>
                </div>

                <div class="row">
                  <div class="col-12">
                    <div class="row">
                      <div class="col-sm-4">
                        <div class="form-group">
                          <label for="institucionesColaboradoras">Actividades</label>
                          <input type="text" class="form-control" formControlName="actividades">

                        </div>
                      </div>

                      <div class="col-sm-4">
                        <div class="form-group">
                          <a class="btn btn-primary mt-3" (click)="agregarPolitica()">+</a>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>



                <div class="row">
                  <div class="col-12 section-divider">
                    <h6 class="primary">Beneficiarios</h6>
                    <hr />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-3">
                    <div class="form-group">
                      <label for="beneficiariosDirectosFamilias">Cantidad Beneficiados</label>
                      <input type="number" class="form-control" formControlName="beneficiariosDirectosFamilias">

                      <!--  <div *ngIf="beneficiariosDirectosFamilias.invalid && (beneficiariosDirectosFamilias.dirty || beneficiariosDirectosFamilias.touched)" class="alert alert-danger">
                        <div *ngIf="beneficiariosDirectosFamilias.errors.required">
                          El campo Familias directas es requerido
                        </div>
                        <div *ngIf="password.errors.minlength">
                          La longitud mínima del password es 4 caracteres
                        </div>
                        <div *ngIf="password.errors.passwordValidation">
                          {{password.errors.passwordValidation.message}}
                        </div>

                      </div> -->
                    </div>

                  </div>

                  <div class="col-md-6 mt-3">
                    <div class="form-group">
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                          value="option1">
                        <label class="form-check-label" for="inlineRadio1">Familias</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                          value="option2">
                        <label class="form-check-label" for="inlineRadio2">Personas</label>
                      </div>

                    </div>
                  </div>

                </div>

                <div class="form-group">
                  <label for="comentarios">Comentarios</label>
                  <input type="text" class="form-control" formControlName="comentarios">
                </div>

                <button type="submit" class="btn btn-success" [disabled]="registerForm.invalid">Enviar</button>
                <a id="formRefresh" (click)="refrescar()" data-toggle="tooltip" data-placement="bottom"
                  title="Refrescar formulario" class="btn btn btn-info btn-sm ml-1"><i class="fa fa-refresh"></i></a>

              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
    <!--/ Kick start -->
  </div>
</div>

<div>
  <a [routerLink]="['/demandas']" class="btn btn-primary"><span>Volver a listado</span>
  </a>

</div>
